services:
  # Database for Aegra (threads, runs and checkpoints of the Agent Protocol graph `agent`).
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coach
      POSTGRES_DB: coach
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Aegra on port 8000: our REST API (/api/v1, docs/api.md) + Agent Protocol (/threads, /runs, graph `agent`).
  backend:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Results of `python -m eval.run_interview` end up in data/eval/ on the host.
      - ./data/eval:/app/data/eval
      # Interview sessions (SQLite), so a backend restart during a demo loses nothing.
      - ./data/sessions:/app/data/sessions
      # Whisper and Piper models (about 2.5 GB), downloaded on the first start and then kept.
      - ./data/models:/app/data/models
      # Accounts and saved interviews (SQLite)
      - storage:/app/storage
    # Values come from the shell or from .env next to this file (both optional,
    # so `make run` also starts on a fresh clone; LLM endpoints then return 502).
    environment:
      LLM_NAME: ${LLM_NAME:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      SESSIONS_DB: /app/data/sessions/sessions.db
      # Aegra (see aegra.json). SERVER=uvicorn runs the REST API alone, without Postgres.
      SERVER: ${SERVER:-aegra}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coach
      POSTGRES_DB: coach
      AUTH_TYPE: noop
      REDIS_BROKER_ENABLED: "false"
      # Voice (docs/api.md: /transcribe, /speech). STT_ENABLED=false or TTS_ENGINE=off switch them off;
      # the frontend then uses the browser's own speech features.
      STT_ENABLED: ${STT_ENABLED:-true}
      STT_MODEL_DE: ${STT_MODEL_DE:-}
      STT_MODEL: ${STT_MODEL:-}
      TTS_ENGINE: ${TTS_ENGINE:-piper}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-switzerlandnorth}
      MODELS_DIR: /app/data/models
      HF_HOME: /app/data/models/hf
      # Eval only: judge model for python -m eval.bench_transcripts (see src/eval/judge.py)
      JUDGE_NAME: ${JUDGE_NAME:-}
      JUDGE_BASE_URL: ${JUDGE_BASE_URL:-}
      JUDGE_API_KEY: ${JUDGE_API_KEY:-}

  frontend:
    build:
      context: ./frontend
      args:
        # The browser calls the backend, so this is a host URL, not a service name.
        # The backend implements docs/api.md; set VITE_USE_MOCK=true to use the in-browser mock instead.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
        VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
    ports:
      - "8080:80"

volumes:
  postgres_data:
  storage:
