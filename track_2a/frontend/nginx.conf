server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text files: the app's JavaScript goes from about 650 kB to about 200 kB on the wire
    # (the nginx image has gzip switched off by default)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri /index.html;
        # index.html names the current build's files: always ask for the newest one
        add_header Cache-Control "no-cache";
    }

    # Built files have a hash in their name, so browsers may cache them for long
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
